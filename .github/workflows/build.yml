name: Docs to PDF
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "docs/**.md"
      - "docs/images/**"
      - "bin/make_nophoto.sh"

jobs:
  converttopdf:
    name: Build PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Generate photo-less variants
        run: sh bin/make_nophoto.sh
      - uses: baileyjm02/markdown-to-pdf@v1
        with:
          input_dir: docs
          output_dir: pdfs
          images_dir: docs/images
          # must match the prefix used in the Markdown: ![..](images/file-name.jpg)
          image_import: images
          build_html: false
          theme: styles/extend.css
          extend_default_theme: true

      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: pdfs
